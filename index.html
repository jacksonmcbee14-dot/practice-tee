<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Practice Tee">
<meta name="theme-color" content="#1d7a3e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Practice Tee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column app, sticky scorecard header, big bottom tab bar, full-screen drill player */
:root{
  --bg:#eaf1e6; --surface:#ffffff; --surface2:#f4f8f1; --ink:#11261a; --muted:#56695b; --line:#d3e0cf;
  --fair:#1d7a3e; --fair-deep:#0e4a24; --on-fair:#ffffff; --flag:#d63a2b; --gold:#e9b625; --sand:#e2d2a4;
  --turf:#4f9a50; --turf2:#5aa65a; --putt:#78c36f; --putt2:#84cc7a; --soil:#7a5a3a; --sky:#dcefff;
  --skin:#e2ab7f; --shirt:#1d7a3e; --pants:#33404a; --cap:#f4f4f0; --steel:#8e9aa3; --grip:#22282c; --ball:#ffffff; --hole:#13221a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1710; --surface:#132419; --surface2:#182d1f; --ink:#e4efe5; --muted:#97ad9c; --line:#25402d;
  --fair:#3dae66; --fair-deep:#b9e8c8; --on-fair:#06140b; --flag:#f0604f; --gold:#f2c94c; --sand:#c9b98a;
  --turf:#2e6a33; --turf2:#34743a; --putt:#3f8a45; --putt2:#46944c; --soil:#4d3a27; --sky:#173048;
  --skin:#d9a077; --shirt:#3dae66; --pants:#9aa7b1; --cap:#e9ece6; --steel:#a7b2ba; --grip:#0d1012; --ball:#ffffff; --hole:#050a07;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1710; --surface:#132419; --surface2:#182d1f; --ink:#e4efe5; --muted:#97ad9c; --line:#25402d;
  --fair:#3dae66; --fair-deep:#b9e8c8; --on-fair:#06140b; --flag:#f0604f; --gold:#f2c94c; --sand:#c9b98a;
  --turf:#2e6a33; --turf2:#34743a; --putt:#3f8a45; --putt2:#46944c; --soil:#4d3a27; --sky:#173048;
  --skin:#d9a077; --shirt:#3dae66; --pants:#9aa7b1; --cap:#e9ece6; --steel:#a7b2ba; --grip:#0d1012; --ball:#ffffff; --hole:#050a07;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--fair-deep)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--fair);color:var(--on-fair);
  padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:root:not([data-theme="light"]) .top{background:var(--fair)}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1;flex:1;min-width:0}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.08em;opacity:.85;margin-top:3px}
.lvl{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:120px}
.lvl b{font-family:var(--display);font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.xpbar{width:120px;height:8px;border-radius:8px;background:rgba(255,255,255,.28);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold);border-radius:8px;transition:width .5s}
.lvl span{font-size:12px;opacity:.9;font-variant-numeric:tabular-nums}

main{max-width:720px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);
  font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.nav button svg{width:28px;height:28px}
.nav button[aria-current="page"]{color:var(--fair)}
.nav button[aria-current="page"] .dot{opacity:1}
.nav .dot{width:5px;height:5px;border-radius:50%;background:var(--flag);opacity:0}

.hero{background:var(--surface);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.hero canvas{display:block;width:100%;aspect-ratio:400/250;max-width:100%;background:var(--sky)}
.hero-txt{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--fair)}
.big{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.05}
.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}

.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-size:24px;text-transform:uppercase;letter-spacing:.03em}
.sec-h span{font-size:13px;color:var(--muted)}

.cards{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:620px){.cards.two{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.card:active{transform:scale(.99)}
.card .ic{flex:none;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--fair)}
.card .ic svg{width:34px;height:34px}
.card .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.card .tx b{font-family:var(--display);font-size:21px;line-height:1.1;letter-spacing:.01em}
.card .tx span{font-size:14px;color:var(--muted)}
.card .go{flex:none;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--fair);display:flex;align-items:center;gap:4px}
.badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--fair);border:1px solid var(--line)}
.badge.new{background:var(--flag);color:#fff;border-color:var(--flag);vertical-align:3px}
.badge.done{background:var(--fair);color:var(--on-fair);border-color:var(--fair)}

.check{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.check.is-done{background:var(--surface2)}
.check.is-done .ct b{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.box{flex:none;width:38px;height:38px;border-radius:50%;border:3px solid var(--fair);background:var(--surface);display:grid;place-items:center;padding:0}
.box svg{width:22px;height:22px;opacity:0}
.is-done .box{background:var(--fair)}
.is-done .box svg{opacity:1;color:var(--on-fair)}
.ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ct b{font-weight:600;font-size:17px;line-height:1.3}
.ct .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.where{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.show{background:none;border:0;padding:0;color:var(--fair);font-weight:700;font-size:15px;text-decoration:underline;text-underline-offset:3px}
.score{display:flex;align-items:center;gap:8px;font-size:15px}
.score input{width:84px;font:inherit;font-family:var(--display);font-size:22px;font-weight:700;padding:4px 8px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}

.weeks{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:none;width:52px;height:60px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.wk b{font-family:var(--display);font-size:22px;line-height:1}
.wk span{font-size:11px;color:var(--muted);font-family:var(--display);letter-spacing:.06em;text-transform:uppercase}
.wk[aria-pressed="true"]{border-color:var(--fair);background:var(--fair);color:var(--on-fair)}
.wk[aria-pressed="true"] span{color:var(--on-fair)}
.wk.full{border-color:var(--gold)}
.phase{background:var(--fair-deep);color:var(--bg);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
:root:not([data-theme="light"]) .phase{color:var(--bg)}
.phase b{font-family:var(--display);font-size:26px;text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.prog{height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--fair);transition:width .4s}

.tip{background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.tip svg{flex:none;width:30px;height:30px;color:var(--gold)}
.tip p{margin:0}
.cathead{display:flex;flex-direction:column;gap:6px}
.cathead h1{font-size:40px;text-transform:uppercase;line-height:1}
.cathead p{margin:0;color:var(--muted);max-width:60ch}
.settings{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.pill-btn{border:2px solid var(--line);background:var(--surface);border-radius:30px;padding:6px 14px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.pill-btn[aria-pressed="true"]{border-color:var(--fair);color:var(--fair)}
.rounds{display:flex;align-items:flex-end;gap:6px;height:90px;padding-top:6px}
.rounds div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;min-width:0}
.rounds i{display:block;width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:var(--fair)}
.rounds i.empty{background:var(--line);height:4px}
.rounds span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.rounds em{font-style:normal;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}

/* Drill player */
.player{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.player-in{width:100%;max-width:720px;margin:0 auto;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;flex:1}
.ph{display:flex;align-items:center;gap:10px}
.ph h2{flex:1;font-size:28px;text-transform:uppercase;line-height:1.05;min-width:0}
.x{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.x svg{width:22px;height:22px}
.stage{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--sky)}
.stage canvas{display:block;width:100%;aspect-ratio:400/250;max-width:100%}
.need{font-size:14px;color:var(--muted)}
.need b{color:var(--ink)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--fair);width:26px;border-radius:10px}
.steptxt{font-size:22px;line-height:1.35;font-weight:500;min-height:4.2em;margin:0}
.stepnum{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--flag)}
.ctrls{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:auto}
.btn{border:0;border-radius:14px;padding:16px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.05em;text-transform:uppercase}
.btn.pri{background:var(--fair);color:var(--on-fair)}
.btn.sec{background:var(--surface);border:2px solid var(--line)}
.btn.win{background:var(--gold);color:#1d1600}
.btn:disabled{opacity:.4;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:30;background:var(--ink);color:var(--bg);
  padding:12px 20px;border-radius:30px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sync{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <div class="brand">Practice Tee<small id="sub">12-WEEK PLAN · WEEK 1</small></div>
  <div class="lvl"><b id="lvlName">Range Rat</b><div class="xpbar"><i id="xpFill" style="width:0%"></i></div><span id="xpTxt">0 / 100 XP</span></div>
</div></header>

<main id="view"></main>

<nav class="nav" aria-label="Sections"><div class="nav-in" id="nav"></div></nav>

<div class="player" id="player" hidden role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <div class="player-in">
    <div class="ph"><h2 id="pTitle">Drill</h2><button class="x" id="pClose" aria-label="Close drill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="stage"><canvas id="pCanvas" width="800" height="500"></canvas></div>
    <div class="need" id="pNeed"></div>
    <div class="dots" id="pDots"></div>
    <div><div class="stepnum" id="pNum">Step 1</div><p class="steptxt" id="pText"></p></div>
    <div class="ctrls"><button class="btn sec" id="pBack">Back</button><button class="btn pri" id="pNext">Next</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ======================= CONTENT ======================= */
const ICONS={
 today:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 28V5l14 5-14 5"/><ellipse cx="16" cy="28" rx="10" ry="2.2"/></svg>',
 swing:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="6" r="3"/><path d="M15 9v10l-4 9M15 19l5 9M15 12l-5 5 13-13"/></svg>',
 long:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 26c6-16 16-20 26-20" stroke-dasharray="3 4"/><circle cx="4" cy="26" r="2.5" fill="currentColor"/><path d="M27 15V4l-5 2.5 5 2.5"/></svg>',
 chip:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 24c4-10 9-10 13 0h10" stroke-dasharray="3 3"/><circle cx="4" cy="24" r="2.5" fill="currentColor"/><path d="M26 24V10l-5 2.5 5 2.5"/><path d="M2 28h28"/></svg>',
 putt:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="22" cy="23" rx="5" ry="2.4"/><circle cx="7" cy="22" r="2.5" fill="currentColor"/><path d="M11 22h6" stroke-dasharray="2 3"/><path d="M22 23V6l6 3-6 3"/></svg>',
 plan:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="6" width="22" height="22" rx="3"/><path d="M5 12h22M11 3v6M21 3v6M10 19l3 3 6-6"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 bulb:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 24h8M13 28h6M16 4a8 8 0 0 0-5 14c1 1 1.5 2 1.5 3h7c0-1 .5-2 1.5-3A8 8 0 0 0 16 4z"/></svg>',
 play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'
};
const TABS=[['today','Today'],['swing','Swing'],['long','Long'],['chip','Chip'],['putt','Putt'],['plan','Plan']];
const CATS={
 swing:{name:'Swing',desc:'How you hold it, how you stand, how you swing. Most of these work at home with one club and no ball.'},
 long:{name:'Long Shots',desc:'Driver, woods and long irons. Take these to the driving range.'},
 chip:{name:'Chipping',desc:'Little shots around the green. A practice green, a backyard or a park all work.'},
 putt:{name:'Putting',desc:'All you need is a putter, a few balls and a couple of tees.'}
};
// scene helpers
const G=(seq,o={})=>({k:'g',seq:Array.isArray(seq)?seq:[seq],...o});
const GR=o=>({k:'gr',...o});
const F=o=>({k:'f',...o});
const R=o=>({k:'r',...o});
const GP=n=>({k:'gp',stage:n});
const D=o=>({k:'dl',...o});
const FULL=['address','takeaway','top','down','impact','finish'];

const DRILLS=[
// ---------- SWING ----------
{id:'s-grip',cat:'swing',name:'The Grip',min:5,where:'Home',need:'Any club (lefties: swap left and right)',steps:[
 ['Hold your top hand out, palm facing you. That\'s your left hand if you\'re right-handed. Lay the handle across the base of your fingers, where they meet your palm. Not in the middle of your palm.',GP(1)],
 ['Wrap your fingers around the handle. Look down at your top hand: you should see 2 or 3 knuckles.',GP(2)],
 ['Rest your thumb on the handle, a little to the right. The crease between your thumb and pointer finger makes a "V". It points at your right shoulder.',GP(3)],
 ['Put your bottom hand on just below. The palm of your bottom hand covers your top thumb, like a lid.',GP(4)],
 ['Pinkies: the easiest way is all 10 fingers on the handle, like a baseball bat. You can also hook your bottom pinky over or between your top fingers. Use whichever feels comfortable.',GP(5)],
 ['Check: both V\'s point at your right shoulder. Squeeze gently, about 4 out of 10, like holding a tube of toothpaste without squirting it.',GP(6)]]},
{id:'s-distance',cat:'swing',name:'How Far to Stand',min:5,where:'Home',need:'Any club',added:'2026-11-17',steps:[
 ['Stand up tall. Hold the club straight out in front of you at belly-button height.',D({mode:'tall'})],
 ['Keep your back straight and bend forward from your hips. Let the club come down until it touches the ground. That spot is where the ball goes.',D({mode:'hinge'})],
 ['Your arms hang straight down from your shoulders. Not reaching out, not squished in.',D({mode:'hang'})],
 ['Check: about one fist of space fits between the end of the club and your legs.',D({mode:'fist'})],
 ['Too close: your arms feel jammed and you hit it off the heel. Too far: you reach and tip onto your toes.',D({mode:'compare'})],
 ['Longer clubs put you farther from the ball by themselves. Same posture every time; the club length does the work.',D({mode:'clubs'})]]},
{id:'s-setup',cat:'swing',name:'Setup & Posture',min:5,where:'Home',need:'Any club',steps:[
 ['Feet about shoulder-width apart.',G('address',{hl:'feet',label:'Shoulder-width'})],
 ['Bend forward from your hips, not your waist. Push your butt back a little.',G('address',{hl:'hips',label:'Hinge at hips'})],
 ['Small knee flex. Like you are about to sit on a tall stool.',G('address',{hl:'knees',label:'Soft knees'})],
 ['Let your arms hang straight down. Hands end up under your chin.',G('address',{hl:'hands',label:'Arms hang'})],

const BY=Object.fromEntries(DRILLS.map(d=>[d.id,d]));
// Extra drills arrive from the shared "drills" collection (added every couple of days)
function setExtras(docs){
  for(let i=DRILLS.length-1;i>=0;i--)if(DRILLS[i].extra){delete BY[DRILLS[i].id];DRILLS.splice(i,1)}
  docs.forEach(doc=>{try{const d=doc.data();if(!d||!CATS[d.cat]||!Array.isArray(d.steps)||!d.steps.length)return;
    const steps=d.steps.map(s=>{const sc=s&&s.s;if(!sc||typeof s.t!=='string'||!SCENE_KINDS.includes(sc.k))throw 0;
      if(sc.k==='g'){sc.seq=(Array.isArray(sc.seq)?sc.seq:[sc.seq]).filter(p=>POSE_NAMES.includes(p));if(!sc.seq.length)sc.seq=['address']}
      return [s.t,sc]});
    const dr={id:'x-'+doc.id,cat:d.cat,name:String(d.name||'New drill'),min:+d.min||10,where:String(d.where||'Range'),need:String(d.need||'Clubs and balls'),steps,added:String(d.added||''),extra:true};
    DRILLS.push(dr);BY[dr.id]=dr}catch(e){}});
}

function streak(){let n=0,d=dayNum(today());if(!S.days[fmt(d)])d--;while(S.days[fmt(d)]){n++;d--}return n}

/* ======================= ANIMATION ENGINE ======================= */
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches?0.5:1;
const anims=new Map();
function startAnim(cv,spec){anims.set(cv,{spec,t0:performance.now(),st:{}});if(!startAnim.on){startAnim.on=1;requestAnimationFrame(loop)}}
function stopAnim(cv){anims.delete(cv)}
function stopAnims(root){for(const cv of anims.keys())if(root.contains(cv))anims.delete(cv)}
let COL={},colT=-1e9;
function cols(now){if(now-colT>1000){colT=now;const cs=getComputedStyle(document.documentElement);
  for(const k of ['turf','turf2','putt','putt2','soil','sky','skin','shirt','pants','cap','steel','grip','ball','hole','flag','gold','sand','ink','muted','surface','fair','line','bg'])COL[k]=cs.getPropertyValue('--'+k).trim()}return COL}
function loop(now){cols(now);
  for(const [cv,a] of anims){if(!cv.isConnected){anims.delete(cv);continue}
    const r=cv.getBoundingClientRect();if(!r.width)continue;const dpr=Math.min(2,devicePixelRatio||1),W=Math.round(r.width*dpr),H=Math.round(r.width*dpr*250/400);
    if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
    const ctx=cv.getContext('2d');ctx.setTransform(W/400,0,0,H/250,0,0);
    const t=(now-a.t0)/1000*RM;
    try{SCENES[a.spec.k](ctx,t,a.spec,a.st)}catch(e){console.error(e)}}
  requestAnimationFrame(loop)}
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
const lerp=(a,b,u)=>a+(b-a)*u;
const rad=d=>d*Math.PI/180;
const dir=d=>[-Math.sin(rad(d)),Math.cos(rad(d))];
let MIR=false;
function mirror(ctx,on){MIR=on;if(on){ctx.translate(400,0);ctx.scale(-1,1)}}
function label(ctx,x,y,text,o={}){ctx.save();ctx.setTransform(ctx.getTransform());
  const m=ctx.getTransform();if(MIR){ctx.translate(400,0);ctx.scale(-1,1)}// undo mirror for text
  ctx.font=`700 ${o.size||16}px "Barlow Condensed", "Arial Narrow", sans-serif`;const w=ctx.measureText(text).width+16,h=(o.size||16)+8;
  let lx=o.align==='left'?x:x-w/2;if(MIR&&o.abs!==true&&o.align!=='left')lx=400-x-w/2;if(MIR&&o.align==='left')lx=x;
  ctx.fillStyle=o.bg||COL.ink;ctx.globalAlpha=o.alpha??.88;roundRect(ctx,lx,y-h/2,w,h,h/2);ctx.fill();
  ctx.globalAlpha=1;ctx.fillStyle=o.fg||COL.surface;ctx.textBaseline='middle';ctx.fillText(text,lx+8,y+1);ctx.restore()}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function ring(ctx,x,y,r,t,rx){ctx.save();ctx.strokeStyle=COL.flag;ctx.lineWidth=3;ctx.globalAlpha=.55+.45*Math.sin(t*6);ctx.beginPath();
  ctx.ellipse(x,y,(rx||r)+2*Math.sin(t*6),r+2*Math.sin(t*6),0,0,7);ctx.stroke();ctx.restore()}
function line(ctx,x1,y1,x2,y2,w,c){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function flagAt(ctx,x,y,h=40){line(ctx,x,y,x,y-h,2,COL.ink);ctx.fillStyle=COL.flag;ctx.beginPath();ctx.moveTo(x,y-h);ctx.lineTo(x+16,y-h+6);ctx.lineTo(x,y-h+12);ctx.fill()}
function clubOnGround(ctx,x1,y1,x2,y2){line(ctx,x1,y1,x2,y2,3.5,COL.steel);const L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L;
  line(ctx,x1,y1,x1+ux*24,y1+uy*24,6,COL.grip);ctx.save();ctx.translate(x2,y2);ctx.rotate(Math.atan2(uy,ux));ctx.fillStyle=COL.steel;roundRect(ctx,-3,-3,10,9,3);ctx.fill();ctx.restore()}
function teePeg(ctx,x,y){ctx.fillStyle=COL.cap;ctx.strokeStyle=COL.ink;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,4.5,0,7);ctx.fill();ctx.stroke();ctx.fillStyle=COL.gold;ctx.beginPath();ctx.arc(x,y,2,0,7);ctx.fill()}
function ballAt(ctx,x,y,r=5){ctx.fillStyle=COL.ball;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.stroke()}

const GROUND=212;
function clubLen(o){return o.club==='driver'?80:o.club==='putter'?58:74}
function golferGeom(p,o){const hip={x:200+p.hx,y:140},S={x:200+p.hx*.55,y:82},head={x:200+p.hx*.3,y:58};
  const armL=o.club==='putter'?50:58,d=dir(p.a),H={x:S.x+armL*d[0],y:S.y+armL*d[1]};const cd=dir(p.c),L=clubLen(o);

function interpPose(seq,t,o){ // returns pose & meta
